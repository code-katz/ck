# Lint for the plugin's Python: the scripts in scripts/ and the test programs in tests/.
# Run it with: ruff check scripts tests
# tests/run.sh runs it as section 20 when Ruff is installed, and says so when it is not.
# F is pyflakes (undefined names, unused imports); B is bugbear (likely bugs).
# The target is the oldest Python the scripts must run on: the one macOS ships. Ruff also
# reports syntax newer than the target, whatever rules are selected.
target-version = "py39"
extend-exclude = [".claude", ".ck"]

[lint]
select = ["F", "B"]
